[tox]
envlist =
    py{310,311,312,313,314}-django{5.2}
    py{312,313,314}-django{6.0,6.1}
skip_missing_interpreters = true

[testenv]
setenv = PYTHONPATH = {toxinidir}
commands = pytest tests
deps =
    pytest
    pytest-django
    djangorestframework
    pytz
    django5.2: Django>=5.2,<6.0
    django6.0: Django>=6.0,<6.1
    django6.1: Django>=6.1,<6.2
